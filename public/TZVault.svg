<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Nền tối tương thích giao diện App -->
  <rect width="200" height="200" fill="#111216" rx="16"/>

  <!-- Nhóm phần tử khung cơ khí và lưới toán học -->
  <g fill="none" stroke="#E5A93C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- 1. Vòng răng cưa ngoài cùng và viền bảo vệ -->
    <circle cx="100" cy="100" r="82" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
    <circle cx="100" cy="100" r="76" stroke-dasharray="8 4" stroke-width="3.5" opacity="0.9"/>
    <circle cx="100" cy="100" r="68" stroke-width="1.5" opacity="0.7"/>

    <!-- 2. Hệ trục tọa độ và các thanh chốt cơ khí đối xứng -->
    <line x1="100" y1="15" x2="100" y2="185" stroke-width="3" opacity="0.85"/>
    <line x1="15" y1="100" x2="185" y2="100" stroke-width="3" opacity="0.85"/>
    
    <!-- Các khía chốt chặn ở 4 đầu trục -->
    <line x1="95" y1="22" x2="105" y2="22" stroke-width="2"/>
    <line x1="95" y1="178" x2="105" y2="178" stroke-width="2"/>
    <line x1="22" y1="95" x2="22" y2="105" stroke-width="2"/>
    <line x1="178" y1="95" x2="178" y2="105" stroke-width="2"/>

    <!-- 3. Vòng tròn chứa ký tự bảo mật -->
    <circle cx="100" cy="100" r="48" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="32" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- 4. Tâm khóa đặc của Vault -->
    <circle cx="100" cy="100" r="14" fill="#E5A93C" stroke-width="2"/>
    <circle cx="100" cy="100" r="6" fill="#111216"/>
    <circle cx="100" cy="100" r="2" fill="#E5A93C"/>
  </g>

  <!-- 5. Lớp văn bản: Thêm các kí tự toán học/mật mã xung quanh tâm két -->
  <g fill="#E5A93C" font-family="monospace, sans-serif" font-size="9" font-weight="bold" text-anchor="middle" dominant-baseline="central">
    <!-- Nhóm kí tự góc trên -->
    <text x="82" y="62">ε</text>
    <text x="100" y="58">λ</text>
    <text x="118" y="62">Σ</text>

    <!-- Nhóm kí tự bên phải -->
    <text x="138" y="82">∮</text>
    <text x="142" y="100">Δ</text>
    <text x="138" y="118">∞</text>

    <!-- Nhóm kí tự góc dưới -->
    <text x="82" y="138">≠</text>
    <text x="100" y="142">≈</text>
    <text x="118" y="138">𝑖</text>

    <!-- Nhóm kí tự bên trái -->
    <text x="62" y="82">Ψ</text>
    <text x="58" y="100">Σ</text>
    <text x="62" y="118">ψ</text>
  </g>
</svg>
