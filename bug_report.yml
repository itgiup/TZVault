name: Bug report
description: Report a non-security bug (crashes, UI issues, incorrect behavior)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Found a security vulnerability?** Please do not report it here — use [private vulnerability reporting](../../security/advisories/new) instead. See [SECURITY.md](../../blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: TZVault version / commit
      placeholder: "v0.1.0-beta or commit hash"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (terminal output from `pnpm tauri dev`, if applicable)
      render: shell
